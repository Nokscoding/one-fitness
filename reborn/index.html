async function upload(file,type){const x=await api("upload",{type,ext:file.name.split(".").pop()});const url=BASE+"/storage/v1/object/upload/sign/reborn-media/"+x.path+"?token="+encodeURIComponent(x.token);const fd=new FormData();fd.append("cacheControl","3600");fd.append("",file);const r=await fetch(url,{method:"PUT",headers:{apikey:KEY,"x-upsert":"false"},body:fd});if(!r.ok)throw new Error("Import impossible : "+r.status);return x.path}
async function save(kind){try{msg("Enregistrement…");let x={...edit,title:$("title").value,published:$("published").checked};if(kind==="Album"){x.artist=$("artist").value;x.release_at=$("release").value?new Date($("release").value).toISOString():null;const f=$("file").files[0];if(f)x.cover_path=await upload(f,"cover")}if(kind==="Track"){x.artist=$("artist").value;x.album_id=$("album").value;x.position=Number($("position").value);x.lyrics=lyricsDraft;const f=$("file").files[0];if(f)x.audio_path=await upload(f,"audio");if(isFinite($("studioAudio").duration))x.duration=$("studioAudio").duration}await api("save"+kind,{value:x});edit=null;await load();msg("Enregistré.")}catch(e){msg(e.message)}}
document.addEventListener("change",e=>{const x=e.target;if(x.id==="file"&&tab==="morceaux"&&x.files[0])$("studioAudio").src=URL.createObjectURL(x.files[0])});document.addEventListener("input",e=>{const x=e.target;if(x.dataset.time!==undefined)lyricsDraft[Number(x.dataset.time)].time=Math.max(0,Number(x.value)||0);if(x.dataset.line!==undefined)lyricsDraft[Number(x.dataset.line)].text=x.value});
document.addEventListener("click",async e=>{const el=e.target.closest("[data-act],[data-play],[data-album],[data-list],[data-lyric],[data-tab],[data-new],[data-edit],[data-save],[data-revoke],[data-disable],[data-stamp],[data-up],[data-down],[data-remove]");if(!el)return;const d=el.dataset;try{
if(d.album){albumId=d.album;playlistId=null;renderLibrary()}if(d.list){playlistId=d.list;renderLibrary()}if(d.play){if(mode!=="queue"||!full)setQueue(visibleTracks());play(data.tracks.find(t=>t.id===d.play))}
if(d.lyric!==undefined&&current)audio.currentTime=current.lyrics[Number(d.lyric)].time;
if(d.tab){tab=d.tab;edit=null;renderAdmin()}if(d.new||d.edit){const [kind,id]=(d.edit||d.new).split(":");edit=id?structuredClone((kind==="Album"?data.albums:kind==="Track"?data.tracks:data.playlists).find(x=>x.id===id)):{title:"",published:false,track_ids:[]};lyricsDraft=structuredClone(edit.lyrics||[]);renderAdmin()}
if(d.save)await save(d.save);if(d.revoke){await api("revoke",{id:d.revoke});await load()}if(d.disable){await api("disableCode",{id:d.disable});await load()}
if(d.stamp!==undefined){let i=Number(d.stamp);lyricsDraft[i].time=Math.round($("studioAudio").currentTime*100)/100;$("lines").innerHTML=lineFields()}
for(const k of ["up","down","remove"])if(d[k]!==undefined){let i=Number(d[k]),ids=edit.track_ids;if(k==="remove")ids.splice(i,1);else{let j=i+(k==="up"?-1:1);if(j>=0&&j<ids.length)[ids[i],ids[j]]=[ids[j],ids[i]]}$("playlistItems").innerHTML=playlistFields()}
switch(d.act){case "logout":await logout();break;case "playall":setQueue(visibleTracks());play(queue[0]);break;case "shuffle":shuffle=!shuffle;setQueue(visibleTracks());play(queue[0]);break;case "toggle":toggle();break;case "next":step(1);break;case "prev":step(-1);break;case "open":full=true;mode="cover";renderFull();break;case "close":full=false;renderFull();break;case "lyrics":mode=mode==="lyrics"?"cover":"lyrics";seekReady=false;renderFull();break;case "queue":mode=mode==="queue"?"cover":"queue";renderFull();break;case "repeat":repeat=!repeat;renderFull();break;case "cancel":edit=null;renderAdmin();break;case "newCode":{const x=await api("newCode",{label:$("codeLabel").value});dash=await api("dashboard");renderAdmin();$("generated").textContent="Copie ce code maintenant : "+x.code;break}case "previewTrack":{const x=await api("stream",{id:edit.id,count:false});$("studioAudio").src=x.url;await $("studioAudio").play();break}case "importLyrics":lyricsDraft=$("rawLyrics").value.split("\n").map(x=>x.trim()).filter(Boolean).map(text=>({time:0,text}));$("lines").innerHTML=lineFields();break;case "addTrack":{let id=$("addTrack").value;if(id&&!edit.track_ids.includes(id))edit.track_ids.push(id);$("playlistItems").innerHTML=playlistFields();break}}
}catch(e){msg(e.message)}});
tok?load():login();
</script></body></html>
